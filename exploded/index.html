<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- A sketch, not a page. Keep it out of search until it graduates. -->
    <meta name="robots" content="noindex" />
    <title>Exploded view — sketch</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <style>
      /*
        The palette is lifted from technical exploded-view drawings: one ink
        colour for every line, paper for faces, and a single tinted accent for
        the part the drawing wants you to notice. Side faces get two quiet
        shades of the ink so the solids read as 3D without any real lighting.
      */
      :root {
        --paper: #f7f8fc;
        --dot: #dfe3f4;
        --ink: #2f4cf0;
        --ink-soft: #2f4cf099;
        --face-top: #ffffff;
        --face-x: #f0f2fb;
        --face-y: #e5e9fa;
        --accent-top: #a9b6fb;
        --accent-x: #95a5fa;
        --accent-y: #8597f7;
        --hole: #dfe4fb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0b1022;
          --dot: #1a2244;
          --ink: #8b9bff;
          --ink-soft: #8b9bff99;
          --face-top: #121a36;
          --face-x: #0f1630;
          --face-y: #0d132a;
          --accent-top: #3a49a8;
          --accent-x: #33419a;
          --accent-y: #2c398a;
          --hole: #0a0f20;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--paper);
        color: var(--ink);
        /* The page loops (see the script), so a scrollbar would only show its
           thumb teleporting. Hide it; wheel, touch and keys still scroll. */
        scrollbar-width: none;
      }

      html::-webkit-scrollbar {
        display: none;
      }

      body {
        margin: 0;
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        /* The faint dot grid of a drafting sheet. Fixed so it reads as the
           paper under the drawing, not something that scrolls past. */
        background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
        background-size: 8px 8px;
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      header,
      .hud {
        position: fixed;
        left: 0;
        right: 0;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
        pointer-events: none;
      }

      header {
        top: 0;
        padding-top: max(16px, env(safe-area-inset-top));
      }

      .hud {
        bottom: 0;
        align-items: flex-end;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }

      header > *,
      .hud > * {
        pointer-events: auto;
      }

      header a {
        text-decoration: none;
      }

      .hud span {
        color: var(--ink-soft);
      }

      .caption {
        display: grid;
        gap: 4px;
      }

      .readout {
        text-align: right;
        display: grid;
        gap: 4px;
        font-variant-numeric: tabular-nums;
      }

      .hint {
        position: fixed;
        left: 50%;
        bottom: max(20px, env(safe-area-inset-bottom));
        translate: -50% 0;
        color: var(--ink-soft);
        transition: opacity 600ms;
      }

      .hint.gone {
        opacity: 0;
      }

      .sound {
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        color: inherit;
        background: var(--paper);
        border: 1px solid var(--ink);
        border-radius: 0;
        padding: 6px 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .sound:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      /* A tiny level meter, so you can see the sound is alive before you
         hear it. Its bars are driven from JS while sound is on. */
      .meter {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 10px;
      }

      .meter i {
        width: 2px;
        height: 2px;
        background: currentColor;
      }

      /* The drawing never moves; the page scrolls underneath it, and only
         the scroll position is used. */
      .stage {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      /* SVG classes. Strokes are non-scaling so the line weight stays a crisp
         1.25px no matter how big the drawing is rendered. */
      svg * {
        vector-effect: non-scaling-stroke;
      }

      .s {
        stroke: var(--ink);
        stroke-width: 1.25;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .top { fill: var(--face-top); }
      .fx { fill: var(--face-x); }
      .fy { fill: var(--face-y); }
      .a.top { fill: var(--accent-top); }
      .a.fx { fill: var(--accent-x); }
      .a.fy { fill: var(--accent-y); }
      .hole { fill: var(--hole); }
      .none { fill: none; }

      .guide {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1;
        stroke-dasharray: 10 7;
      }

      .leader {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1;
      }

      .head {
        fill: var(--ink);
      }

      .label {
        fill: var(--ink);
        font-size: 17px;
        letter-spacing: 0.12em;
      }
    </style>
  </head>

  <body>
    <svg class="stage" role="img"></svg>

    <header>
      <a href="/">Aarón García Hervás</a>
      <button class="sound" type="button" aria-pressed="false">
        <span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="sound-label">Sound off</span>
      </button>
    </header>

    <div class="hud">
      <div class="caption"></div>
      <div class="readout" aria-hidden="true"><span class="stage-name"></span><span class="angle"></span></div>
    </div>
    <p class="hint">Scroll</p>

    <!-- Only here to give the page something to scroll. -->
    <div class="track"></div>

    <script>
      (() => {
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

        /*
          Isometric projection. World space is z-up; screen space is SVG's
          y-down. A point further along +x or +y comes towards the viewer and
          slides down the screen. The whole figure can spin about its vertical
          axis by `theta`, applied in local x/y before projecting.
        */
        const C30 = Math.cos(Math.PI / 6);
        const S30 = 0.5;
        let cosT = 1;
        let sinT = 0;
        const R = (x, y) => [x * cosT - y * sinT, x * sinT + y * cosT];
        const P = (x, y, z) => {
          const [rx, ry] = R(x, y);
          return [(rx - ry) * C30, (rx + ry) * S30 - z];
        };
        // A circle of radius r on a horizontal plane projects to an
        // axis-aligned ellipse whatever the spin. sqrt(2) comes from the 45°
        // rotation of iso.
        const RX = Math.SQRT2 * C30;
        const RY = Math.SQRT2 * S30;

        const f = (n) => Math.round(n * 10) / 10;
        const pts = (list) => list.map(([x, y]) => `${f(x)},${f(y)}`).join(" ");
        const poly = (list, cls) => `<polygon class="s ${cls}" points="${pts(list)}"/>`;

        // How much a local face normal points at the viewer, who looks along
        // -(1, 1) in rotated world x/y. Positive means visible.
        const facing = (nx, ny) => {
          const [wx, wy] = R(nx, ny);
          return wx + wy;
        };
        // Faces turned to the screen's right get one shade, left the other,
        // which keeps a consistent "light from the upper left" while spinning.
        const shade = (nx, ny) => {
          const [wx, wy] = R(nx, ny);
          return wx - wy > 0 ? "fx" : "fy";
        };

        // Top-face decorations, in the part's local x/y on its top plane.
        function details(list, z, ox, oy) {
          return (list || [])
            .map((d) => {
              const cls = d.fill || "none";
              if (d.rect) {
                const [u0, v0, u1, v1] = d.rect;
                return poly(
                  [P(ox + u0, oy + v0, z), P(ox + u1, oy + v0, z), P(ox + u1, oy + v1, z), P(ox + u0, oy + v1, z)],
                  cls,
                );
              }
              if (d.circle) {
                const [u, v, r] = d.circle;
                const [cx, cy] = P(ox + u, oy + v, z);
                return `<ellipse class="s ${cls}" cx="${f(cx)}" cy="${f(cy)}" rx="${f(r * RX)}" ry="${f(r * RY)}"/>`;
              }
              return "";
            })
            .join("");
        }

        // Left-most and right-most of some projected points, which is where
        // leader lines and assembly guides hook onto a part.
        const extremes = (list) =>
          list.reduce(
            (acc, p) => ({
              left: p[0] < acc.left[0] ? p : acc.left,
              right: p[0] > acc.right[0] ? p : acc.right,
            }),
            { left: list[0], right: list[0] },
          );

        const shapes = {
          // A box, optionally a frustum (`inset` pulls the top face in, which
          // is all a keycap really is). Of its four sides only the ones facing
          // the viewer are drawn; a convex solid never overlaps itself, so
          // they need no sorting among themselves.
          box(p, o) {
            const [x0, x1] = [p.x[0] + o[0], p.x[1] + o[0]];
            const [y0, y1] = [p.y[0] + o[1], p.y[1] + o[1]];
            const [z0, z1] = [p.z[0] + o[2], p.z[1] + o[2]];
            const d = p.inset || 0;
            const a = p.accent ? "a " : "";
            const B = [
              [x0, y0],
              [x1, y0],
              [x1, y1],
              [x0, y1],
            ];
            const T = [
              [x0 + d, y0 + d],
              [x1 - d, y0 + d],
              [x1 - d, y1 - d],
              [x0 + d, y1 - d],
            ];
            const normals = [
              [0, -1],
              [1, 0],
              [0, 1],
              [-1, 0],
            ];
            let svg = "";
            normals.forEach(([nx, ny], i) => {
              if (facing(nx, ny) <= 1e-6) return;
              const j = (i + 1) % 4;
              svg += poly(
                [P(...B[i], z0), P(...B[j], z0), P(...T[j], z1), P(...T[i], z1)],
                a + shade(nx, ny),
              );
            });
            svg += poly(
              T.map((c) => P(...c, z1)),
              a + "top",
            );
            svg += details(p.details, z1, o[0], o[1]);
            const zm = (z0 + z1) / 2;
            return { svg, ...extremes(B.map((c) => P(...c, zm))) };
          },

          cyl(p, o) {
            const [cx, cy] = [(p.c?.[0] || 0) + o[0], (p.c?.[1] || 0) + o[1]];
            const [z0, z1] = [p.z[0] + o[2], p.z[1] + o[2]];
            const rx = p.r * RX;
            const ry = p.r * RY;
            const [bx, by] = P(cx, cy, z0);
            const [, ty] = P(cx, cy, z1);
            const a = p.accent ? "a " : "";
            // Side wall: down the left edge, round the front half of the
            // bottom ellipse (sweep 0 goes via the bottom on screen), back up.
            const side =
              `<path class="s ${a}fx" d="M${f(bx - rx)},${f(ty)} L${f(bx - rx)},${f(by)} ` +
              `A${f(rx)},${f(ry)} 0 0 0 ${f(bx + rx)},${f(by)} L${f(bx + rx)},${f(ty)} Z"/>`;
            const top = `<ellipse class="s ${a}top" cx="${f(bx)}" cy="${f(ty)}" rx="${f(rx)}" ry="${f(ry)}"/>`;
            const ym = (by + ty) / 2;
            return {
              svg: side + top + details(p.details, z1, cx, cy),
              left: [bx - rx, ym],
              right: [bx + rx, ym],
            };
          },

          // A coil spring. Its height grows with the part's explode amount so
          // it visibly decompresses as the parts around it fly apart.
          helix(p, o, e) {
            const [cx, cy] = [o[0], o[1]];
            const z0 = p.z[0] + o[2];
            const z1 = z0 + p.h + p.stretch * Math.max(0, e);
            const steps = p.turns * 28;
            const line = [];
            for (let i = 0; i <= steps; i++) {
              const t = (i / steps) * p.turns * Math.PI * 2;
              line.push(P(cx + p.r * Math.cos(t), cy + p.r * Math.sin(t), z0 + ((z1 - z0) * i) / steps));
            }
            const [bx] = P(cx, cy, z0);
            const ym = (P(cx, cy, z0)[1] + P(cx, cy, z1)[1]) / 2;
            return {
              svg: `<polyline class="s none" points="${pts(line)}"/>`,
              left: [bx - p.r * RX, ym],
              right: [bx + p.r * RX, ym],
            };
          },
        };

        /*
          The figures. Parts are listed in paint order, bottom to top, and
          their vertical offsets only ever grow in that order, so painting in
          list order is correct at any spin. The exception is a part marked
          `side`: it sits flush in its host's +x face and slides out
          sideways, so render() decides per frame whether it's in front of
          the stack or behind it.

          Offsets are centred on the middle part, so the drawing grows both
          up and down from where it rests. `root` is the pitch a figure's
          clicks are tuned around.
        */
        const FIGURES = {
          cube: {
            name: "Cube",
            note: "A plain block, until you look inside.",
            root: 220,
            parts: [
              {
                name: "Base plate",
                side: "l",
                shape: "box",
                x: [-70, 70], y: [-70, 70], z: [0, 14],
                details: [
                  { circle: [-54, -54, 6], fill: "hole" },
                  { circle: [54, -54, 6], fill: "hole" },
                  { circle: [-54, 54, 6], fill: "hole" },
                  { circle: [54, 54, 6], fill: "hole" },
                ],
                off: [0, 0, -150],
              },
              {
                name: "Logic board",
                side: "r",
                shape: "box",
                accent: true,
                x: [-70, 70], y: [-70, 70], z: [14, 22],
                details: [
                  { rect: [-44, -44, -4, -14], fill: "top" },
                  { rect: [10, -44, 44, -26], fill: "top" },
                  { rect: [10, -16, 44, 2], fill: "top" },
                  { rect: [-44, 4, -20, 44], fill: "top" },
                ],
                off: [0, 0, -75],
              },
              {
                name: "Core",
                side: "l",
                shape: "box",
                x: [-70, 70], y: [-70, 70], z: [22, 112],
                details: [
                  { circle: [0, 0, 40] },
                  { circle: [0, 0, 26], fill: "hole" },
                ],
                off: [0, 0, 0],
              },
              {
                name: "Lid",
                side: "r",
                shape: "box",
                x: [-70, 70], y: [-70, 70], z: [112, 140],
                details: [
                  { rect: [-56, -56, 56, 24] },
                  { rect: [-56, 38, -36, 56], fill: "hole" },
                ],
                off: [0, 0, 150],
              },
              {
                name: "Switch",
                side: "r",
                shape: "box",
                flush: true,
                accent: true,
                x: [58, 70], y: [-22, 22], z: [52, 82],
                off: [100, 0, 36],
              },
            ],
          },
          cylinder: {
            name: "Cylinder",
            note: "Four discs pretending to be one.",
            root: 196,
            parts: [
              { name: "Foot", side: "l", shape: "cyl", r: 74, z: [0, 12], off: [0, 0, -150] },
              {
                name: "Magnetic disk",
                side: "r",
                shape: "cyl",
                accent: true,
                r: 74, z: [12, 18],
                details: [
                  { circle: [0, 0, 62] },
                  { circle: [0, 0, 24], fill: "top" },
                  { circle: [0, 0, 7], fill: "hole" },
                  { rect: [30, -6, 52, 6], fill: "top" },
                ],
                off: [0, 0, -70],
              },
              {
                name: "Body",
                side: "l",
                shape: "cyl",
                r: 74, z: [18, 82],
                details: [
                  { circle: [0, 0, 44] },
                  { circle: [0, 0, 24], fill: "hole" },
                ],
                off: [0, 0, 10],
              },
              {
                name: "Hub",
                side: "r",
                shape: "cyl",
                accent: true,
                r: 24, z: [82, 96],
                details: [{ circle: [0, 0, 8], fill: "hole" }],
                off: [0, 0, 90],
              },
              {
                name: "Cap",
                side: "l",
                shape: "cyl",
                r: 74, z: [82, 104],
                details: [
                  { circle: [0, 0, 60] },
                  { rect: [-8, -66, 8, -50], fill: "hole" },
                ],
                off: [0, 0, 170],
              },
            ],
          },
          steps: {
            name: "Steps",
            note: "A pyramid is a stack of decisions.",
            root: 247,
            parts: [
              {
                name: "Foundation",
                side: "l",
                shape: "box",
                x: [-84, 84], y: [-84, 84], z: [0, 24],
                details: [{ rect: [-72, -72, 72, 72] }],
                off: [0, 0, -160],
              },
              { name: "Terrace", side: "r", shape: "box", x: [-64, 64], y: [-64, 64], z: [24, 48], off: [0, 0, -80] },
              { name: "Terrace", side: "l", shape: "box", x: [-44, 44], y: [-44, 44], z: [48, 72], off: [0, 0, 0] },
              { name: "Sanctum", side: "r", shape: "box", x: [-24, 24], y: [-24, 24], z: [72, 96], off: [0, 0, 80] },
              { name: "Beacon", side: "l", shape: "cyl", accent: true, r: 10, z: [96, 112], off: [0, 0, 150] },
            ],
          },
          key: {
            name: "Key",
            note: "Every keystroke is a tiny machine.",
            root: 262,
            parts: [
              {
                name: "Plate",
                side: "l",
                shape: "box",
                x: [-80, 80], y: [-80, 80], z: [0, 8],
                details: [{ rect: [-36, -36, 36, 36], fill: "hole" }],
                off: [0, 0, -150],
              },
              {
                name: "Housing",
                side: "r",
                shape: "box",
                x: [-36, 36], y: [-36, 36], z: [8, 44],
                details: [
                  { rect: [-28, -28, 28, 28] },
                  { circle: [0, 0, 11], fill: "hole" },
                ],
                off: [0, 0, -60],
              },
              {
                name: "Spring",
                side: "l",
                shape: "helix",
                r: 13, z: [44], h: 10, stretch: 56, turns: 5,
                off: [0, 0, -10],
              },
              {
                name: "Stem",
                side: "r",
                shape: "box",
                accent: true,
                x: [-7, 7], y: [-7, 7], z: [54, 80],
                details: [
                  { rect: [-7, -2, 7, 2], fill: "hole" },
                  { rect: [-2, -7, 2, 7], fill: "hole" },
                ],
                off: [0, 0, 60],
              },
              {
                name: "Keycap",
                side: "l",
                shape: "box",
                inset: 12,
                x: [-60, 60], y: [-60, 60], z: [44, 90],
                details: [{ circle: [0, 0, 22] }],
                off: [0, 0, 160],
              },
            ],
          },
        };

        // ?fig=key (or cylinder, steps) to try the other figures.
        const pick = new URLSearchParams(location.search).get("fig");
        const def = FIGURES[pick] || FIGURES.cube;

        const zs = def.parts.flatMap((p) => p.z.concat(p.h ? [p.z[0] + p.h] : []));
        const zc = (Math.min(...zs) + Math.max(...zs)) / 2;

        const VIEW = { w: 760, h: 820 };
        const svg = document.querySelector(".stage");
        svg.setAttribute("viewBox", `${-VIEW.w / 2} ${-VIEW.h / 2} ${VIEW.w} ${VIEW.h}`);
        svg.setAttribute(
          "aria-label",
          `Isometric drawing of a ${def.name.toLowerCase()} that comes apart into ` +
            `${def.parts.map((p) => p.name.toLowerCase()).join(", ")}, spins, and goes back together as you scroll`,
        );
        document.querySelector(".caption").innerHTML = `Fig. 01 — ${def.name}<span>${def.note}</span>`;
        const stageName = document.querySelector(".stage-name");
        const angleOut = document.querySelector(".angle");

        const arrow = ([x, y], dir) => {
          // A small filled arrowhead pointing in `dir` (unit vector).
          const [dx, dy] = dir;
          const s = 7;
          const w = 3.2;
          return `<polygon class="head" points="${pts([
            [x, y],
            [x - dx * s - dy * w, y - dy * s + dx * w],
            [x - dx * s + dy * w, y - dy * s - dx * w],
          ])}"/>`;
        };

        // Per part: explode amount, plus a little landing bounce.
        const state = def.parts.map(() => ({ e: 0, bounce: 0, age: 1 }));

        function render(theta) {
          cosT = Math.cos(theta);
          sinT = Math.sin(theta);
          let guides = "";
          let behind = "";
          let body = "";
          let front = "";
          let labels = "";
          const pending = [];

          def.parts.forEach((p, i) => {
            const { e } = state[i];
            // Bounce: a decaying hop, only ever upwards, after landing.
            const hop = state[i].bounce * Math.exp(-state[i].age * 9) * Math.abs(Math.sin(state[i].age * 26)) * 7;
            const o = [p.off[0] * e, p.off[1] * e, p.off[2] * e - zc + hop];
            const cur = shapes[p.shape](p, o, e);
            let hidden = false;

            if (p.flush) {
              // A flush part leaves a slot in its host's +x face. Until it has
              // slid clear it's hidden and the slot is drawn in its colour, so
              // assembled it reads as one surface with a seam. Once out, it's
              // painted in front of or behind the stack depending on which
              // side of it the spin has carried it to.
              const out = Math.abs(p.off[0] * e) > p.x[1] - p.x[0];
              if (facing(1, 0) > 1e-6) {
                const [y0, y1] = p.y;
                const [z0, z1] = p.z.map((z) => z - zc);
                body += poly(
                  [P(p.x[1], y0, z0), P(p.x[1], y1, z0), P(p.x[1], y1, z1), P(p.x[1], y0, z1)],
                  out ? "hole" : "a fx",
                );
              }
              hidden = !out;
              if (out) {
                const [wx, wy] = R(p.x[1] + o[0], 0);
                if (wx + wy > 0) front += cur.svg;
                else {
                  behind += cur.svg;
                  // Tucked behind the stack: no point labelling what you
                  // can't see.
                  hidden = true;
                }
              }
            } else body += cur.svg;

            const travel = Math.hypot(...p.off) * e;
            if (travel > 4) {
              // Assembly guides: dashed lines from where the part lives to
              // where it is now, with an arrow pointing home.
              const rest = shapes[p.shape](p, [0, 0, -zc], 0);
              const alpha = f(Math.min(1, travel / 40));
              for (const key of ["left", "right"]) {
                const [ax, ay] = rest[key];
                const [bx, by] = cur[key];
                const len = Math.hypot(bx - ax, by - ay) || 1;
                const dir = [(ax - bx) / len, (ay - by) / len];
                guides +=
                  `<g opacity="${alpha}"><line class="guide" x1="${f(bx)}" y1="${f(by)}" x2="${f(ax)}" y2="${f(ay)}"/>` +
                  `${arrow([ax, ay], dir)}</g>`;
              }
            }

            // Labels fade in as the parts separate; assembled, the drawing is
            // just a shape. Placed after the loop, once all anchors are known.
            const t = Math.min(1, Math.max(0, (e - 0.25) / 0.45));
            if (t > 0 && !hidden) {
              const left = p.side === "l";
              pending.push({ left, t, name: p.name, anchor: left ? cur.left : cur.right });
            }
          });

          /*
            While the figure spins, anchors on the same side can drift into
            each other. Sort each column by height and push labels apart to a
            minimum gap; the leader then runs diagonally to its true anchor,
            the way a draughtsperson would dodge a crowded spot.
          */
          const GAP = 30;
          for (const left of [true, false]) {
            const col = pending.filter((l) => l.left === left).sort((a, b) => a.anchor[1] - b.anchor[1]);
            col.forEach((l, i) => {
              l.y = l.anchor[1];
              if (i && l.y < col[i - 1].y + GAP) l.y = col[i - 1].y + GAP;
            });
            const lx = left ? -VIEW.w / 2 + 130 : VIEW.w / 2 - 130;
            for (const l of col) {
              const [ax, ay] = l.anchor;
              const tip = [ax + (left ? -8 : 8), ay];
              const elbow = [lx + (left ? 24 : -24), l.y];
              const len = Math.hypot(tip[0] - elbow[0], tip[1] - elbow[1]) || 1;
              labels +=
                `<g opacity="${f(l.t)}">` +
                `<text class="label" x="${f(left ? lx - 10 : lx + 10)}" y="${f(l.y + 6)}" ` +
                `text-anchor="${left ? "end" : "start"}">${l.name.toUpperCase()}</text>` +
                `<polyline class="leader" points="${pts([[lx, l.y], elbow, tip])}"/>` +
                arrow(tip, [(tip[0] - elbow[0]) / len, (tip[1] - elbow[1]) / len]) +
                `</g>`;
            }
          }

          svg.innerHTML = guides + behind + body + front + labels;
        }

        /*
          Sound. Nothing is created until the toggle is pressed: browsers
          won't start audio without a gesture anyway, and a page that makes
          noise unasked is rude. Two voices:
          - a breathy filtered-noise "whoosh" that follows scroll speed and
            opens up as things come apart;
          - a short wooden click each time a part lands back in place, pitched
            per part, loudness from how fast it was going.
        */
        const sound = {
          ctx: null,
          on: false,
          start() {
            if (!this.ctx) {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              this.ctx = ctx;
              this.master = ctx.createGain();
              this.master.gain.value = 0;
              this.master.connect(ctx.destination);

              const len = ctx.sampleRate * 2;
              this.noise = ctx.createBuffer(1, len, ctx.sampleRate);
              const data = this.noise.getChannelData(0);
              for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

              const src = ctx.createBufferSource();
              src.buffer = this.noise;
              src.loop = true;
              this.whooshFilter = ctx.createBiquadFilter();
              this.whooshFilter.type = "bandpass";
              this.whooshFilter.frequency.value = 400;
              this.whooshFilter.Q.value = 0.8;
              this.whooshGain = ctx.createGain();
              this.whooshGain.gain.value = 0;
              src.connect(this.whooshFilter).connect(this.whooshGain).connect(this.master);
              src.start();
            }
            this.ctx.resume();
            this.master.gain.setTargetAtTime(0.9, this.ctx.currentTime, 0.05);
            this.on = true;
          },
          stop() {
            if (!this.ctx) return;
            this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.05);
            this.on = false;
            setTimeout(() => !this.on && this.ctx.suspend(), 300);
          },
          air(speed, spread) {
            if (!this.on) return;
            const t = this.ctx.currentTime;
            this.whooshGain.gain.setTargetAtTime(Math.min(0.22, speed * 0.09), t, 0.06);
            this.whooshFilter.frequency.setTargetAtTime(350 + spread * 1600, t, 0.08);
          },
          click(freq, strength) {
            if (!this.on) return;
            const ctx = this.ctx;
            const t = ctx.currentTime;
            const g = Math.min(1, strength);

            // The tone: a triangle blip that drops a touch in pitch, which
            // reads as "wood" more than "beep".
            const osc = ctx.createOscillator();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq * 2, t);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.6, t + 0.08);
            const og = ctx.createGain();
            og.gain.setValueAtTime(0.0001, t);
            og.gain.exponentialRampToValueAtTime(0.28 * g + 0.0001, t + 0.004);
            og.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
            osc.connect(og).connect(this.master);
            osc.start(t);
            osc.stop(t + 0.16);

            // The tick: a very short burst of bright noise for the contact.
            const n = ctx.createBufferSource();
            n.buffer = this.noise;
            const bp = ctx.createBiquadFilter();
            bp.type = "bandpass";
            bp.frequency.value = 3200 + Math.random() * 1200;
            bp.Q.value = 1.4;
            const ng = ctx.createGain();
            ng.gain.setValueAtTime(0.0001, t);
            ng.gain.exponentialRampToValueAtTime(0.35 * g + 0.0001, t + 0.002);
            ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
            n.connect(bp).connect(ng).connect(this.master);
            n.start(t, Math.random());
            n.stop(t + 0.04);
          },
        };

        const button = document.querySelector(".sound");
        const buttonLabel = button.querySelector(".sound-label");
        const bars = [...button.querySelectorAll(".meter i")];
        button.addEventListener("click", () => {
          if (sound.on) sound.stop();
          else sound.start();
          button.setAttribute("aria-pressed", String(sound.on));
          buttonLabel.textContent = sound.on ? "Sound on" : "Sound off";
        });

        /*
          The loop. One cycle of scrolling takes the figure through:

            rest → explode → spin 360° → reassemble → rest

          The page is a few cycles tall and we start in the middle. Whenever
          you get near either end we jump the scroll position by a whole
          number of cycles, which lands on an identical frame, so you can
          scroll forever in either direction and never see the seam.
        */
        const CYCLE = 2400; // px of scroll per cycle
        const COPIES = 6;
        document.querySelector(".track").style.height = `${CYCLE * COPIES + innerHeight}px`;
        history.scrollRestoration = "manual";
        scrollTo(0, CYCLE * (COPIES / 2));

        // Where each phase ends, as a fraction of the cycle.
        const PHASES = [
          ["Assembled", 0.08],
          ["Exploding", 0.38],
          ["Rotating", 0.68],
          ["Assembling", 0.96],
          ["Assembled", 1],
        ];
        const clamp01 = (x) => Math.min(1, Math.max(0, x));
        const smooth = (x) => x * x * (3 - 2 * x);
        const span = (u, a, b) => clamp01((u - a) / (b - a));

        // Parts don't all move at once: each one's window is offset so they
        // peel off one by one, and land one by one, which is also what turns
        // the clicks into a little run of notes.
        const STAGGER = 0.45;
        const n = def.parts.length;
        const partT = (t, i) => clamp01((t - (i / Math.max(1, n - 1)) * STAGGER) / (1 - STAGGER));

        function pose(u) {
          const out = span(u, PHASES[0][1], PHASES[1][1]);
          const spin = span(u, PHASES[1][1], PHASES[2][1]);
          const back = span(u, PHASES[2][1], PHASES[3][1]);
          return {
            // Lifting off eases in and out. Coming back uses a quarter sine,
            // which leaves gently and arrives at full speed, so each part
            // lands with a knock instead of drifting into place.
            e: (i) =>
              u < PHASES[1][1]
                ? smooth(partT(out, i))
                : u < PHASES[2][1]
                  ? 1
                  : Math.sin((1 - partT(back, n - 1 - i)) * (Math.PI / 2)),
            theta: smooth(spin) * Math.PI * 2,
            stage: PHASES.find(([, end]) => u < end)?.[0] ?? "Assembled",
          };
        }

        let lastY = scrollY;
        let total = 0; // unwrapped scroll distance, immune to the jumps
        let shown = 0; // `total`, smoothed, so the drawing has a little weight
        let speed = 0;
        let lastT = performance.now();
        let lastKey = "";
        const hint = document.querySelector(".hint");
        const PENTA = [0, 3, 5, 7, 10, 12, 15];

        function frame(now) {
          const dt = Math.min(0.05, (now - lastT) / 1000);
          lastT = now;

          let y = scrollY;
          if (y < CYCLE || y > CYCLE * (COPIES - 1)) {
            const jump = y < CYCLE ? CYCLE * 2 : -CYCLE * 2;
            scrollTo(0, y + jump);
            lastY += jump;
            y = scrollY;
          }
          const dy = y - lastY;
          lastY = y;
          total += dy;
          if (dy && !hint.classList.contains("gone")) hint.classList.add("gone");

          const ease = reduceMotion ? 1 : 1 - Math.exp(-dt * 12);
          shown += (total - shown) * ease;
          if (Math.abs(total - shown) < 0.05) shown = total;

          speed += (Math.abs(dy) / Math.max(dt * 1000, 1) - speed) * 0.2;
          if (speed < 0.001) speed = 0;

          const u = (((shown / CYCLE) % 1) + 1) % 1;
          const { e, theta, stage } = pose(u);

          let moving = false;
          let spread = 0;
          state.forEach((s, i) => {
            const next = e(i);
            // Landing: the part was in the air and now it's home.
            if (s.e > 0.002 && next <= 0.002) {
              const hit = Math.min(1, (s.e - next) / Math.max(dt, 1e-3) / 3);
              sound.click(def.root * Math.pow(2, PENTA[i % PENTA.length] / 12), 0.25 + hit);
              if (!reduceMotion) {
                s.bounce = 0.4 + hit * 0.6;
                s.age = 0;
              }
            }
            if (s.age < 1) {
              s.age += dt;
              moving = true;
            }
            s.e = next;
            spread += next / n;
          });

          sound.air(speed, spread);
          if (sound.on) {
            bars.forEach((bar, i) => {
              const level = Math.min(1, speed * 0.8 + spread * 0.6) * (0.6 + 0.4 * Math.sin(now / 90 + i * 1.7));
              bar.style.height = `${2 + Math.round(Math.max(0, level) * 8)}px`;
            });
          } else {
            bars.forEach((bar) => (bar.style.height = "2px"));
          }

          // Only touch the DOM when something visibly changed.
          const key = `${f(shown)}|${moving}`;
          if (key !== lastKey || moving) {
            lastKey = key;
            render(theta);
            stageName.textContent = stage;
            angleOut.textContent = `Rot ${String(Math.round((theta * 180) / Math.PI) % 360).padStart(3, "0")}°`;
          }

          requestAnimationFrame(frame);
        }

        render(0);
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
